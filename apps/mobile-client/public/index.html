<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Static shell cannot read tokens at runtime: theme-color = brand.json color.light.background (white screen tops),
         body background = color.light.surface. Update both when the branding changes. -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #f0f5f6;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="mobile-native">
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      [role="button"],
      [role="tab"],
      a {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      textarea,
      select {
        font-size: 17px;
      }
    </style>
  </head>

  <body>
    <noscript>Activa JavaScript para usar la app.</noscript>
    <div id="root"></div>
  </body>
</html>
