# Production origin behind Cloudflare (Full (strict) TLS + Authenticated Origin Pulls).
# Certificates and the Cloudflare origin-pull CA are mounted from /etc/cleaning-platform/tls (outside Git).
server_tokens off;

upstream api { server api:8000; keepalive 16; }

server {
    listen 80 default_server;
    return 444;  # only Cloudflare over TLS reaches the origin
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate         /etc/nginx/tls/origin.pem;
    ssl_certificate_key     /etc/nginx/tls/origin.key;
    ssl_client_certificate  /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # Trust CF-Connecting-IP only from Cloudflare ranges (regenerate: scripts/cloudflare-realip.sh).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /healthz { access_log off; proxy_pass http://api/healthz; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
